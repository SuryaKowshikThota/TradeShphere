<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeSphere – Log in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="login-intro">
      <img src="Logo.jpg" alt="TradeSphere" class="login-logo">
      <h1>Learn to trade without risking a rupee.</h1>
      <p>Start with ₹1,00,000 in virtual cash, buy and sell real-looking stocks, and watch your portfolio move.</p>
    </section>

    <section class="login-box">
      <div class="form-tabs" role="tablist">
        <button class="form-tab active" data-tab="login" type="button">Log in</button>
        <button class="form-tab" data-tab="register" type="button">Create account</button>
      </div>

      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="email" required>
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
        <button type="submit" class="button button-blue">Log in</button>
        <p class="error-message" id="loginMessage" role="alert"></p>
        <button type="button" class="text-button" id="demoButton">Use the demo account</button>
      </form>

      <form id="registerForm" hidden>
        <label for="registerName">Full name</label>
        <input type="text" id="registerName" autocomplete="name" required>
        <label for="registerEmail">Email</label>
        <input type="email" id="registerEmail" autocomplete="email" required>
        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword" autocomplete="new-password" minlength="6" required>
        <button type="submit" class="button button-blue">Create account</button>
        <p class="error-message" id="registerMessage" role="alert"></p>
      </form>
    </section>
  </main>
  <script src="store.js"></script>
  <script src="auth.js"></script>
</body>
</html>
