<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeSphere - Log in</title>
  <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">

  <div class="login-layout">

    <!-- Left side: logo and welcome text -->
    <div class="login-intro">
      <img src="Logo.jpg" alt="TradeSphere" class="login-logo">
      <h1>Learn to trade without risking a rupee.</h1>
      <p>Start with ₹1,00,000 in virtual cash, buy and sell real-looking stocks, and watch your portfolio move.</p>
    </div>

    <!-- Right side: white login box -->
    <div class="login-box">

      <!-- Two buttons to switch between the forms -->
      <div class="form-tabs">
        <button class="form-tab active" data-tab="login" type="button">Log in</button>
        <button class="form-tab" data-tab="register" type="button">Create account</button>
      </div>

      <!-- Login form -->
      <form id="loginForm">
        <!-- It connects a label to the input that has the same id. The value of for must match the id exactly. -->
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required>

        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required>

        <button type="submit" class="button button-blue">Log in</button>
        <p class="error-message" id="loginMessage"></p>
        <button type="button" class="text-button" id="demoButton">Use the demo account</button>
      </form>

      <!-- Create account form (hidden until the tab is clicked) -->
      <form id="registerForm" hidden>
        <label for="registerName">Full name</label>
        <input type="text" id="registerName" required>

        <label for="registerEmail">Email</label>
        <input type="email" id="registerEmail" required>

        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword" minlength="6" required>

        <button type="submit" class="button button-blue">Create account</button>
        <p class="error-message" id="registerMessage"></p>
      </form>

    </div>
  </div>

  <script src="store.js"></script>
  <script src="auth.js"></script>
</body>
</html>
