<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeSphere – Log in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <section class="auth-intro">
      <img src="Logo.jpg" alt="TradeSphere" class="auth-logo">
      <h1>Learn to trade without risking a rupee.</h1>
      <p>Start with ₹1,00,000 in virtual cash, buy and sell real-looking stocks, and watch your portfolio move.</p>
    </section>

    <section class="auth-card">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="login" type="button">Log in</button>
        <button class="tab" data-tab="register" type="button">Create account</button>
      </div>

      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="email" required>
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
        <button type="submit" class="btn btn-primary">Log in</button>
        <p class="form-message" id="loginMessage" role="alert"></p>
        <button type="button" class="link-button" id="fillDemo">Use the demo account</button>
      </form>

      <form id="registerForm" hidden>
        <label for="regName">Full name</label>
        <input type="text" id="regName" autocomplete="name" required>
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" autocomplete="email" required>
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" autocomplete="new-password" minlength="6" required>
        <button type="submit" class="btn btn-primary">Create account</button>
        <p class="form-message" id="registerMessage" role="alert"></p>
      </form>
    </section>
  </main>
  <script src="store.js"></script>
  <script src="auth.js"></script>
</body>
</html>
